services:

  frontend:
    image: yugandhar25/frontend:v2.1
    ports:
      - "3000:8080"
    environment:
      PORT: 8080
      PRODUCT_CATALOG_SERVICE_ADDR: productcatalogservice:3550
      CURRENCY_SERVICE_ADDR: currencyservice:7000
      CART_SERVICE_ADDR: cartservice:7070
      RECOMMENDATION_SERVICE_ADDR: recommendationservice:8080
      SHIPPING_SERVICE_ADDR: shippingservice:50051
      CHECKOUT_SERVICE_ADDR: checkoutservice:5050
      AD_SERVICE_ADDR: adservice:9555
      SHOPPING_ASSISTANT_SERVICE_ADDR: "dummy:8080"
      DISABLE_PROFILER: "1"
    depends_on:
      - productcatalogservice
      - currencyservice
      - cartservice
      - recommendationservice
      - shippingservice
      - checkoutservice
      - paymentservice
      - emailservice
      - adservice
      - redis

  productcatalogservice:
    image: yugandhar25/productcatalogservice:v1
    ports:
      - "3550:3550"
    environment:
      PORT: 3550
      DISABLE_PROFILER: "1"

  currencyservice:
    image: yugandhar25/currencyservice:v1
    ports:
      - "7000:7000"
    environment:
      PORT: 7000
      DISABLE_PROFILER: "1"

  cartservice:
    image: yugandhar25/cartservice:v1
    ports:
      - "7070:7070"
    environment:
      REDIS_ADDR: redis:6379
      DISABLE_PROFILER: "1"
    depends_on:
      - redis

  recommendationservice:
    image: yugandhar25/recommendationservice:v3
    ports:
      - "8081:8080"
    environment:
      PRODUCT_CATALOG_SERVICE_ADDR: productcatalogservice:3550
      DISABLE_PROFILER: "1"

  shippingservice:
    image: yugandhar25/shippingservice:v3
    ports:
      - "50051:50051"
    environment:
      DISABLE_PROFILER: "1"

  checkoutservice:
    image: yugandhar25/checkoutservice:v2
    ports:
      - "5050:5050"
    environment:
      PRODUCT_CATALOG_SERVICE_ADDR: productcatalogservice:3550
      SHIPPING_SERVICE_ADDR: shippingservice:50051
      PAYMENT_SERVICE_ADDR: paymentservice:50051
      EMAIL_SERVICE_ADDR: emailservice:8080
      CURRENCY_SERVICE_ADDR: currencyservice:7000
      CART_SERVICE_ADDR: cartservice:7070
      DISABLE_PROFILER: "1"

  paymentservice:
    image: yugandhar25/paymentservice:v2
    ports:
      - "50052:50051"
    environment:
      PORT: 50051
      DISABLE_PROFILER: "1"

  emailservice:
    build:
      context: ./src/emailservice
    ports:
      - "8082:8080"
    environment:
      PORT: 8080
      DISABLE_PROFILER: "1"

  adservice:
    image: yugandhar25/adservice:v1
    ports:
      - "9555:9555"
    environment:
      PORT: 9555
      DISABLE_PROFILER: "1"

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"